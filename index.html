<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Virtual Nebulosa</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    * {
      font-family: 'Poppins', sans-serif !important;
      box-sizing: border-box;
    }

    /* CURSOR DE MANITA ABIERTA / CERRADA PARA ARRASTRE */
    html, body, canvas.a-canvas, a-scene {
      cursor: grab !important;
      cursor: -webkit-grab !important;
      user-select: none;
    }
    body:active, canvas.a-canvas:active, a-scene:active {
      cursor: grabbing !important;
      cursor: -webkit-grabbing !important;
    }

    /* MODAL DE INFORMACIÓN DE OBRA */
    #artwork-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 8, 18, 0.65);
      backdrop-filter: blur(8px);
      z-index: 10000000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #artwork-modal {
      background: linear-gradient(145deg, rgba(28, 20, 48, 0.95), rgba(16, 12, 28, 0.95));
      border: 1px solid rgba(192, 132, 252, 0.35);
      border-radius: 20px;
      padding: 28px 24px 24px;
      max-width: 440px;
      width: 100%;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(168, 85, 247, 0.25);
      position: relative;
      animation: modalFadeIn 0.22s ease-out;
      user-select: text;
      cursor: default;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.92) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    #artwork-modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      color: #e9d5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    #artwork-modal-close:hover {
      background: rgba(239, 68, 68, 0.3);
      color: #ffffff;
      border-color: #ef4444;
    }
    #artwork-modal-badge {
      display: inline-block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #c084fc;
      background: rgba(192, 132, 252, 0.15);
      border: 1px solid rgba(192, 132, 252, 0.3);
      border-radius: 12px;
      padding: 3px 10px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    #artwork-modal-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 10px 0;
      color: #ffffff;
      line-height: 1.3;
    }
    #artwork-modal-desc {
      font-size: 13px;
      line-height: 1.6;
      color: #d8b4fe;
      margin: 0 0 20px 0;
    }
    #artwork-modal-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      box-sizing: border-box;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #ffffff;
      text-decoration: none;
      padding: 11px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 6px 18px rgba(124, 58, 237, 0.45);
    }
    #artwork-modal-link:hover {
      background: linear-gradient(135deg, #6d28d9, #9333ea);
      transform: translateY(-1px);
    }

    /* REPRODUCTOR FLOTANTE DE VIDEO YOUTUBE CON BOTÓN 'X' */
    #video-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 6, 16, 0.88);
      backdrop-filter: blur(12px);
      z-index: 10000001;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #video-modal-wrapper {
      position: relative;
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }
    #video-modal-close {
      position: relative;
      background: rgba(28, 20, 48, 0.95);
      border: 1.5px solid rgba(192, 132, 252, 0.6);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6), 0 0 15px rgba(168, 85, 247, 0.5);

    }
    #video-modal-close:hover {
      background: #ef4444;
      border-color: #ef4444;
      transform: scale(1.1);
    }
    #video-modal-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: 16px;
      overflow: hidden;
      border: 1.5px solid rgba(192, 132, 252, 0.45);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(168, 85, 247, 0.4);
      animation: modalFadeIn 0.22s ease-out;
    }
    #video-modal-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* GUÍA DE NAVEGACIÓN Y BOTONES EN PANTALLA */
    #nav-guide {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      right: 20px;
      background: rgba(14, 14, 20, 0.92);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      padding: 16px 14px;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      z-index: 9999999 !important;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      user-select: none;
      cursor: default !important;
    }

    .guide-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #9c9cb8;
      font-weight: 700;
    }

    .arrow-pad {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .arrow-row {
      display: flex;
      gap: 5px;
    }
    .key-cap {
      width: 34px;
      height: 34px;
      background: #252535;
      border: 1px solid #404058;
      border-bottom: 3px solid #161622;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      color: #f5f5fa;

      transition: all 0.1s ease;

    }
    .key-cap:hover {
      background: #3b3b54;
      border-color: #6366f1;
    }
    .key-cap:active {
      transform: translateY(2px);
      border-bottom-width: 1px;
    }

    .guide-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      text-align: center;
      color: #dcdcfa;
      gap: 5px;
    }

    .mouse-icon {
      width: 22px;
      height: 30px;
      border: 2px solid #ffffff;
      border-radius: 13px;
      position: relative;
    }
    .mouse-icon::after {
      content: '';
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 7px;
      background: #ffffff;
      border-radius: 2px;
    }

    /* BOTÓN DINÁMICO: SALIR A LA NEBULOSA / VOLVER A LA GALERÍA */
    #btn-toggle-nebulosa {
      width: 100%;
      box-sizing: border-box;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
      cursor: pointer !important;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.45);
      transition: all 0.2s ease;
      text-align: center;
      touch-action: manipulation;
    }
    #btn-toggle-nebulosa:hover {
      transform: scale(1.03);
    }
    #btn-toggle-nebulosa.afuera {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.5);
    }
  </style>

  <script>
    function abrirModalObra(titulo, desc, link) {
      document.getElementById('artwork-modal-title').textContent = titulo || 'Obra';
      document.getElementById('artwork-modal-desc').textContent = desc || 'Descripción disponible próximamente.';
      const btnLink = document.getElementById('artwork-modal-link');
      btnLink.href = link || 'https://galerianebulosa.com/obras-destacadas/';
      btnLink.target = '_blank';
      document.getElementById('artwork-modal-overlay').style.display = 'flex';
    }

    function cerrarModalObra() {
      document.getElementById('artwork-modal-overlay').style.display = 'none';
    }

    function abrirModalVideo(videoId) {
      const iframe = document.getElementById('youtube-player-frame');
      iframe.src = `https://www.youtube.com/embed/${videoId || 'GZRF6dSq7tk'}?autoplay=1&rel=0`;
      document.getElementById('video-modal-overlay').style.display = 'flex';
    }

    function cerrarModalVideo() {
      const iframe = document.getElementById('youtube-player-frame');
      iframe.src = '';
      document.getElementById('video-modal-overlay').style.display = 'none';
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        cerrarModalVideo();
        cerrarModalObra();
      }
    });

    // MOVIMIENTO RELATIVO A HACIA DÓNDE MIRA LA CÁMARA
    function moverConBoton(tecla) {
      const cameraRig = document.querySelector('#rig');
      const cameraEl = document.querySelector('a-camera');
      if (cameraRig && cameraEl && cameraEl.object3D) {
        const dir = new THREE.Vector3();
        cameraEl.object3D.getWorldDirection(dir);
        dir.y = 0;
        dir.normalize();

        const paso = 0.8;
        let dx = 0, dz = 0;

        if (tecla === 'ArrowUp') {
          dx = -dir.x * paso;
          dz = -dir.z * paso;
        } else if (tecla === 'ArrowDown') {
          dx = dir.x * paso;
          dz = dir.z * paso;
        } else if (tecla === 'ArrowLeft') {
          dx = -dir.z * paso;
          dz = dir.x * paso;
        } else if (tecla === 'ArrowRight') {
          dx = dir.z * paso;
          dz = -dir.x * paso;
        }

        const p = cameraRig.getAttribute('position');
        cameraRig.setAttribute('position', { x: p.x + dx, y: p.y, z: p.z + dz });
      }
    }

    // CONTROL INTELIGENTE DE ENTRADA Y SALIDA A LA NEBULOSA
    let enLaNebulosa = false;
    let ultimaPosicionGaleria = { x: -12.5, y: 2.05, z: -10.0 };

    function alternarNebulosa() {
      const cameraRig = document.querySelector('#rig');
      const btn = document.getElementById('btn-toggle-nebulosa');
      if (!cameraRig || !btn) return;

      if (!enLaNebulosa) {
        const posActual = cameraRig.getAttribute('position');
        ultimaPosicionGaleria = { x: posActual.x, y: posActual.y, z: posActual.z };
        cameraRig.setAttribute('position', { x: 0, y: 15.0, z: 22.0 });
        enLaNebulosa = true;
        btn.textContent = '🏛️ Volver a la Galería';
        btn.classList.add('afuera');
      } else {
        cameraRig.setAttribute('position', ultimaPosicionGaleria);
        enLaNebulosa = false;
        btn.textContent = '🌌 Salir a la Nebulosa';
        btn.classList.remove('afuera');
      }
    }

    // =========================================================================
    // DELIMITADOR PERIMETRAL DE SEGURIDAD
    // =========================================================================
    function esDentroDeLaGaleria(x, z) {
      const enTrofeos = (x >= -10.1 && x <= 0.2 && z >= -25.2 && z <= -14.5);
      const enPasillo = (x >= -20.1 && x <= 20.1 && z >= -15.2 && z <= -4.8);
      const enAlaDerecha = (x >= -0.2 && x <= 20.1 && z >= -5.2 && z <= 25.2);
      return (enTrofeos || enPasillo || enAlaDerecha);
    }

    // =========================================================================
    // MAPA DE COLISIÓN GEOMÉTRICA (PISO Y MUROS)
    // =========================================================================
    function crearMapaColision(tris, opt) {
      opt = opt || {};
      var ojoY = opt.ojoY != null ? opt.ojoY : 2.05;
      var ini = opt.inicio || { x: 0, z: 0 };
      var n = Math.floor(tris.length / 9);
      var info = { triangulos: n };
      if (n === 0) return { activo: false, motivo: 'el modelo no tiene geometría', info: info };

      var i, j, o;
      var hist = {};
      var yTope = ojoY - 0.6;
      var bajoPies = -Infinity;
      var ax, ay, az, bx, by, bz, cx, cy, cz, ux, uy, uz, vx, vy, vz, nx, ny, nz, len, cosY;
      for (i = 0; i < n; i++) {
        o = i * 9;
        ax = tris[o]; ay = tris[o + 1]; az = tris[o + 2];
        bx = tris[o + 3]; by = tris[o + 4]; bz = tris[o + 5];
        cx = tris[o + 6]; cy = tris[o + 7]; cz = tris[o + 8];
        ux = bx - ax; uy = by - ay; uz = bz - az;
        vx = cx - ax; vy = cy - ay; vz = cz - az;
        nx = uy * vz - uz * vy; ny = uz * vx - ux * vz; nz = ux * vy - uy * vx;
        len = Math.sqrt(nx * nx + ny * ny + nz * nz);
        if (len < 1e-9) continue;
        if (Math.abs(ny) / len > 0.95) {
          var yy = (ay + by + cy) / 3;
          if (yy < yTope) {
            var kb = Math.round(yy / 0.05);
            hist[kb] = (hist[kb] || 0) + len / 2;
            if (yy > bajoPies) {
              var dd = (bz - cz) * (ax - cx) + (cx - bx) * (az - cz);
              if (Math.abs(dd) > 1e-12) {
                var q1 = ((bz - cz) * (ini.x - cx) + (cx - bx) * (ini.z - cz)) / dd;
                var q2 = ((cz - az) * (ini.x - cx) + (ax - cx) * (ini.z - cz)) / dd;
                if (q1 >= -1e-9 && q2 >= -1e-9 && 1 - q1 - q2 >= -1e-9) bajoPies = yy;
              }
            }
          }
        }
      }
      var pisoY = ojoY - 1.7, pisoDetectado = false;
      if (bajoPies > -Infinity) {
        pisoY = bajoPies;
        pisoDetectado = true;
      } else {
        var mejor = 0, claves = Object.keys(hist), puntajes = {}, kk;
        for (i = 0; i < claves.length; i++) {
          kk = parseInt(claves[i], 10);
          puntajes[kk] = (hist[kk - 1] || 0) + (hist[kk] || 0) + (hist[kk + 1] || 0);
          if (puntajes[kk] > mejor) mejor = puntajes[kk];
        }
        if (mejor > 0) {
          var yElegida = -Infinity;
          for (i = 0; i < claves.length; i++) {
            kk = parseInt(claves[i], 10);
            if (puntajes[kk] >= mejor * 0.85 && kk * 0.05 > yElegida) yElegida = kk * 0.05;
          }
          pisoY = yElegida;
          pisoDetectado = true;
        }
      }
      info.pisoY = Math.round(pisoY * 100) / 100;

      var minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
      var yBajo = pisoY - 0.2, yAlto = pisoY + 2.2;
      for (i = 0; i < n; i++) {
        o = i * 9;
        ay = tris[o + 1]; by = tris[o + 4]; cy = tris[o + 7];
        if (Math.max(ay, by, cy) < yBajo || Math.min(ay, by, cy) > yAlto) continue;
        for (j = 0; j < 9; j += 3) {
          var px = tris[o + j], pz = tris[o + j + 2];
          if (px < minX) minX = px;
          if (px > maxX) maxX = px;
          if (pz < minZ) minZ = pz;
          if (pz > maxZ) maxZ = pz;
        }
      }
      if (!(maxX > minX) || !(maxZ > minZ)) return { activo: false, motivo: 'no hay geometría a la altura del cuerpo', info: info };
      minX -= 1; minZ -= 1; maxX += 1; maxZ += 1;
      var CELDA = 0.1;
      while (Math.ceil((maxX - minX) / CELDA) * Math.ceil((maxZ - minZ) / CELDA) > 4e6) CELDA *= 1.5;
      var PASO = CELDA / 2;
      var W = Math.ceil((maxX - minX) / CELDA) + 1;
      var H = Math.ceil((maxZ - minZ) / CELDA) + 1;
      var piso = new Uint8Array(W * H);
      var muro = new Uint8Array(W * H);
      info.celdaM = Math.round(CELDA * 100) / 100;

      var alturas = [0.35, 0.8, 1.25, 1.7];
      var s, hh, pts, t, ix, iz, steps, sx, sz, L;
      var marcarSegmento = function (x1, z1, x2, z2) {
        L = Math.sqrt((x2 - x1) * (x2 - x1) + (z2 - z1) * (z2 - z1));
        steps = Math.max(1, Math.ceil(L / PASO));
        for (j = 0; j <= steps; j++) {
          sx = x1 + (x2 - x1) * (j / steps);
          sz = z1 + (z2 - z1) * (j / steps);
          ix = Math.floor((sx - minX) / CELDA);
          iz = Math.floor((sz - minZ) / CELDA);
          if (ix >= 0 && iz >= 0 && ix < W && iz < H) muro[iz * W + ix] = 1;
        }
      };
      var nMuros = 0, nPiso = 0;
      for (i = 0; i < n; i++) {
        o = i * 9;
        ax = tris[o]; ay = tris[o + 1]; az = tris[o + 2];
        bx = tris[o + 3]; by = tris[o + 4]; bz = tris[o + 5];
        cx = tris[o + 6]; cy = tris[o + 7]; cz = tris[o + 8];
        ux = bx - ax; uy = by - ay; uz = bz - az;
        vx = cx - ax; vy = cy - ay; vz = cz - az;
        nx = uy * vz - uz * vy; ny = uz * vx - ux * vz; nz = ux * vy - uy * vx;
        len = Math.sqrt(nx * nx + ny * ny + nz * nz);
        if (len < 1e-9) continue;
        cosY = Math.abs(ny) / len;

        if (cosY < 0.9) {
          var yMin = Math.min(ay, by, cy), yMax = Math.max(ay, by, cy);
          var contado = false;
          for (s = 0; s < alturas.length; s++) {
            hh = pisoY + alturas[s];
            if (hh < yMin || hh > yMax) continue;
            pts = [];
            if ((ay > hh) !== (by > hh)) { t = (hh - ay) / (by - ay); pts.push(ax + t * (bx - ax), az + t * (bz - az)); }
            if ((by > hh) !== (cy > hh)) { t = (hh - by) / (cy - by); pts.push(bx + t * (cx - bx), bz + t * (cz - bz)); }
            if ((cy > hh) !== (ay > hh)) { t = (hh - cy) / (ay - cy); pts.push(cx + t * (ax - cx), cz + t * (az - cz)); }
            if (pts.length >= 4) { marcarSegmento(pts[0], pts[1], pts[2], pts[3]); contado = true; }
          }
          if (contado) nMuros++;
        } else if (cosY > 0.95) {
          var ym = (ay + by + cy) / 3;
          if (Math.abs(ym - pisoY) < 0.12) {
            var x0 = Math.min(ax, bx, cx), x1 = Math.max(ax, bx, cx);
            var z0 = Math.min(az, bz, cz), z1 = Math.max(az, bz, cz);
            var i0 = Math.max(0, Math.floor((x0 - minX) / CELDA)), i1 = Math.min(W - 1, Math.floor((x1 - minX) / CELDA));
            var k0 = Math.max(0, Math.floor((z0 - minZ) / CELDA)), k1 = Math.min(H - 1, Math.floor((z1 - minZ) / CELDA));
            var det = (bz - cz) * (ax - cx) + (cx - bx) * (az - cz);
            var marcado = false;
            if (Math.abs(det) > 1e-12) {
              for (var kz = k0; kz <= k1; kz++) {
                var pz2 = minZ + (kz + 0.5) * CELDA;
                for (var kx = i0; kx <= i1; kx++) {
                  var px2 = minX + (kx + 0.5) * CELDA;
                  var l1 = ((bz - cz) * (px2 - cx) + (cx - bx) * (pz2 - cz)) / det;
                  var l2 = ((cz - az) * (px2 - cx) + (ax - cx) * (pz2 - cz)) / det;
                  var l3 = 1 - l1 - l2;
                  if (l1 >= -1e-9 && l2 >= -1e-9 && l3 >= -1e-9) { piso[kz * W + kx] = 1; marcado = true; }
                }
              }
            }
            if (!marcado) {
              ix = Math.floor(((ax + bx + cx) / 3 - minX) / CELDA);
              iz = Math.floor(((az + bz + cz) / 3 - minZ) / CELDA);
              if (ix >= 0 && iz >= 0 && ix < W && iz < H) piso[iz * W + ix] = 1;
            }
            nPiso++;
          }
        }
      }
      var celdasPiso = 0, celdasMuro = 0;
      for (i = 0; i < piso.length; i++) { celdasPiso += piso[i]; celdasMuro += muro[i]; }
      info.celdasPiso = celdasPiso;
      info.celdasMuro = celdasMuro;
      info.trianguloMuros = nMuros;
      info.trianguloPiso = nPiso;
      info.pisoDetectado = pisoDetectado && celdasPiso >= 400;

      var offsCache = {};
      var offsets = function (r) {
        var key = r.toFixed(3);
        if (offsCache[key]) return offsCache[key];
        var R = Math.ceil(r / CELDA), lista = [], a, b;
        for (b = -R; b <= R; b++) for (a = -R; a <= R; a++) {
          if ((a * CELDA) * (a * CELDA) + (b * CELDA) * (b * CELDA) <= r * r) lista.push(a, b);
        }
        offsCache[key] = lista;
        return lista;
      };
      var cfg = { piso: true, muro: true, offs: offsets(0.45), alc: null };
      var libreCelda = function (ix2, iz2) {
        if (ix2 < 0 || iz2 < 0 || ix2 >= W || iz2 >= H) return false;
        var k = iz2 * W + ix2;
        if (cfg.muro && muro[k]) return false;
        if (cfg.piso && !piso[k]) return false;
        return true;
      };
      var cuerpoLibre = function (ix2, iz2) {
        var of = cfg.offs;
        for (var q = 0; q < of.length; q += 2) if (!libreCelda(ix2 + of[q], iz2 + of[q + 1])) return false;
        return true;
      };
      var sx0 = Math.floor((ini.x - minX) / CELDA), sz0 = Math.floor((ini.z - minZ) / CELDA);
      var cola = new Int32Array(W * H);
      var inundar = function () {
        var vis = new Uint8Array(W * H), cabeza = 0, cola2 = 0, cuenta = 0, toca = false;
        if (!cuerpoLibre(sx0, sz0)) return { vis: vis, cuenta: 0, toca: false };
        vis[sz0 * W + sx0] = 1; cola[cola2++] = sz0 * W + sx0;
        while (cabeza < cola2) {
          var c = cola[cabeza++], cxi = c % W, czi = (c - cxi) / W;
          cuenta++;
          if (cxi <= 1 || czi <= 1 || cxi >= W - 2 || czi >= H - 2) toca = true;
          var vec = [cxi + 1, czi, cxi - 1, czi, cxi, czi + 1, cxi, czi - 1];
          for (var d = 0; d < 8; d += 2) {
            var nxi = vec[d], nzi = vec[d + 1];
            if (nxi < 0 || nzi < 0 || nxi >= W || nzi >= H) continue;
            var kn = nzi * W + nxi;
            if (vis[kn]) continue;
            if (!cuerpoLibre(nxi, nzi)) continue;
            vis[kn] = 1; cola[cola2++] = kn;
          }
        }
        return { vis: vis, cuenta: cuenta, toca: toca };
      };

      var combos = [];
      if (info.pisoDetectado) combos.push({ piso: true, muro: true });
      if (info.pisoDetectado) combos.push({ piso: true, muro: false });
      combos.push({ piso: false, muro: true });
      var radios = [0.45, 0.35, 0.25, 0.15];
      var elegido = null;
      for (var ci = 0; ci < combos.length && !elegido; ci++) {
        for (var ri = 0; ri < radios.length && !elegido; ri++) {
          cfg.piso = combos[ci].piso; cfg.muro = combos[ci].muro; cfg.offs = offsets(radios[ri]);
          var res = inundar();
          if (res.cuenta * CELDA * CELDA >= 15) {
            elegido = { piso: cfg.piso, muro: cfg.muro, radio: radios[ri], res: res };
          }
        }
      }
      if (!elegido) {
        return { activo: false, motivo: 'no se pudo ubicar una zona caminable desde el punto de inicio', info: info };
      }
      cfg.piso = elegido.piso; cfg.muro = elegido.muro; cfg.offs = offsets(elegido.radio);
      cfg.alc = elegido.res.vis;
      info.usaPiso = elegido.piso;
      info.usaMuros = elegido.muro;
      info.radio = elegido.radio;
      info.areaCaminable = Math.round(elegido.res.cuenta * CELDA * CELDA);
      info.zonaAbierta = elegido.res.toca;

      var permitido = function (x, z) {
        if (!esDentroDeLaGaleria(x, z)) return false;
        var ix2 = Math.floor((x - minX) / CELDA), iz2 = Math.floor((z - minZ) / CELDA);
        if (ix2 < 0 || iz2 < 0 || ix2 >= W || iz2 >= H) return false;
        return cfg.alc[iz2 * W + ix2] === 1;
      };

      var mover = function (x0, z0, x1, z1) {
        var dx = x1 - x0, dz = z1 - z0;
        var dist = Math.sqrt(dx * dx + dz * dz);
        var pasos = Math.max(1, Math.ceil(dist / (CELDA * 0.8)));
        var sdx = dx / pasos, sdz = dz / pasos;
        var x = x0, z = z0, choco = false;
        for (var p = 0; p < pasos; p++) {
          if (permitido(x + sdx, z + sdz)) { x += sdx; z += sdz; }
          else if (sdx !== 0 && permitido(x + sdx, z)) { x += sdx; choco = true; }
          else if (sdz !== 0 && permitido(x, z + sdz)) { z += sdz; choco = true; }
          else { choco = true; }
        }
        return { x: x, z: z, choco: choco };
      };

      return { activo: true, permitido: permitido, mover: mover, info: info };
    }

    AFRAME.registerSystem('colision-paredes', {

    AFRAME.registerComponent('colision-paredes', {
      init: function () {
        this.system.comp = this;
        const p = this.el.object3D.position;
        this.mapa = null;
        this.listo = false;
        this.inicio = { x: p.x, z: p.z };
        this.prev = new THREE.Vector3().copy(p);
        this.bueno = new THREE.Vector3().copy(p);
        window.colisionEstado = 'esperando el modelo de la sala';

        this.camEl = this.el.querySelector('a-camera') || this.el.querySelector('[camera]');
        if (this.camEl) {
          this.camEl.setAttribute('wasd-controls', 'enabled: false');
        }
      },

      remove: function () {
        if (this.system.comp === this) {
          this.system.comp = null;
        }
      },

      construir: function () {
        const roomEl = document.querySelector('[gltf-model="#modelo-sala"]');
        if (!roomEl) return false;
        const raiz = roomEl.getObject3D('mesh');
        if (!raiz) return false;

        try {
          raiz.updateMatrixWorld(true);
          let total = 0;
          const mallas = [];
          raiz.traverse((nodo) => {
            if (nodo.isMesh && nodo.visible !== false && nodo.geometry && nodo.geometry.attributes && nodo.geometry.attributes.position) {
              mallas.push(nodo);
              const g = nodo.geometry;
              total += Math.floor((g.index ? g.index.count : g.attributes.position.count) / 3);
            }
          });

          const tris = new Float32Array(total * 9);
          const v = new THREE.Vector3();
          let o = 0;
          mallas.forEach((nodo) => {
            const g = nodo.geometry, pos = g.attributes.position, idx = g.index, m = nodo.matrixWorld;
            const cuenta = Math.floor((idx ? idx.count : pos.count) / 3) * 3;
            for (let t = 0; t < cuenta; t++) {
              const vi = idx ? idx.getX(t) : t;
              v.fromBufferAttribute(pos, vi).applyMatrix4(m);
              tris[o++] = v.x; tris[o++] = v.y; tris[o++] = v.z;
            }
          });

          const ojoY = this.el.object3D.position.y || 2.05;
          this.mapa = crearMapaColision(tris, { ojoY: ojoY, inicio: this.inicio });
        } catch (err) {
          console.warn('[Colisión] error al preparar las paredes:', err);
          this.mapa = { activo: false, motivo: String(err) };
        }

        this.listo = true;
        if (this.mapa.activo) {
          window.colisionEstado = 'activa';
          window.colisionInfo = this.mapa.info;
        } else {
          window.colisionEstado = 'desactivada: ' + this.mapa.motivo;
        }
        return true;
      },

      corregir: function () {
        const p = this.el.object3D.position;

        if (this.camEl && this.camEl.object3D) {
          this.camEl.object3D.position.set(0, 0, 0);
        }

        if (enLaNebulosa) {
          this.prev.copy(p);
          return;
        }

        if (!this.listo) {
          this.construir();
          if (!this.listo) {
            p.y = 2.05;
            if (!esDentroDeLaGaleria(p.x, this.prev.z)) p.x = this.prev.x;
            if (!esDentroDeLaGaleria(p.x, p.z)) p.z = this.prev.z;
            if (!esDentroDeLaGaleria(p.x, p.z)) { p.x = this.bueno.x; p.z = this.bueno.z; }
            else { this.bueno.set(p.x, p.y, p.z); }
            this.prev.copy(p);
            return;
          }
        }

        p.y = 2.05;

        const dx = p.x - this.prev.x;
        const dz = p.z - this.prev.z;
        if (Math.abs(dx) < 0.000001 && Math.abs(dz) < 0.000001) return;

        if (Math.sqrt(dx * dx + dz * dz) > 3.0) {
          if (this.mapa && this.mapa.activo && this.mapa.permitido(p.x, p.z)) {
            this.bueno.set(p.x, p.y, p.z);
          } else if (esDentroDeLaGaleria(p.x, p.z)) {
            this.bueno.set(p.x, p.y, p.z);
          } else {
            p.x = this.bueno.x;
            p.z = this.bueno.z;
          }
          this.prev.copy(p);
          return;
        }

        if (this.mapa && this.mapa.activo) {
          const r = this.mapa.mover(this.prev.x, this.prev.z, p.x, p.z);
          p.x = r.x;
          p.z = r.z;

          if (this.mapa.permitido(p.x, p.z)) {
            this.bueno.set(p.x, p.y, p.z);
          } else {
            p.x = this.bueno.x;
            p.z = this.bueno.z;
          }
        } else {
          if (!esDentroDeLaGaleria(p.x, this.prev.z)) p.x = this.prev.x;
          if (!esDentroDeLaGaleria(p.x, p.z)) p.z = this.prev.z;
          if (!esDentroDeLaGaleria(p.x, p.z)) { p.x = this.bueno.x; p.z = this.bueno.z; }
          else { this.bueno.set(p.x, p.y, p.z); }
        }

        this.prev.copy(p);
      },

      tick: function () {
        this.corregir();
      }
    });

    AFRAME.registerComponent('enhancer', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;

          const objetosParaEliminar = [];

          mesh.traverse((node) => {
            const matName = node.material && node.material.name ? node.material.name.toLowerCase() : "";
            const objName = node.name ? node.name.toLowerCase() : "";
            const combined = objName + " " + matName;

            const esVegetacion = combined.includes('plant') || combined.includes('leaf') || 
                                 combined.includes('leaves') || combined.includes('hoja') || 
                                 combined.includes('pot') || combined.includes('maceta') || 
                                 combined.includes('tree') || combined.includes('foliage') || 
                                 combined.includes('flora') || combined.includes('flower') || 
                                 combined.includes('branch') || combined.includes('vase');

            let tieneColorPlanta = false;
            if (node.material && node.material.color) {
              const c = node.material.color;
              if (c.g > 0.18 && c.g > c.r * 1.15 && c.g > c.b * 1.05) {
                tieneColorPlanta = true;
              }
            }

            if (esVegetacion || tieneColorPlanta) {
              objetosParaEliminar.push(node);
            }

            if (node.isMesh && node.material) {
              if (combined.includes('glass') || combined.includes('window') || combined.includes('vidrio') || combined.includes('cristal') || combined.includes('panel')) {
                node.material.color = new THREE.Color(0x22222b);
                node.material.transparent = true;
                node.material.opacity = 0.52;
                node.material.roughness = 0.20;
                node.material.metalness = 0.15;
                node.material.depthWrite = false;
              } 
              else if (combined.includes('light') || combined.includes('foco') || combined.includes('lamp') || combined.includes('spot') || combined.includes('bulb')) {
                node.material.emissive = new THREE.Color(0xffeedd);
                node.material.emissiveIntensity = 4.0;
              } 
              else if (combined.includes('floor') || combined.includes('suelo') || combined.includes('piso')) {
                node.material.color = new THREE.Color(0xd0d4de);
                node.material.roughness = 0.25;
                node.material.metalness = 0.08;
              } 
              else if (combined.includes('wall') || combined.includes('pared') || combined.includes('muro')) {
                node.material.color = new THREE.Color(0x584b70);
                node.material.roughness = 0.88;
                node.material.metalness = 0.02;
              } 
              node.material.needsUpdate = true;
            }
          });

          objetosParaEliminar.forEach((obj) => {
            obj.visible = false;
            obj.scale.set(0, 0, 0);
            if (obj.geometry) obj.geometry.dispose();
            if (obj.parent) obj.parent.remove(obj);
          });
        });
      }
    });

    AFRAME.registerComponent('video-handler', {
      init: function () {
        const video = document.querySelector('#video-nebulosa');
        if (!video) return;

        video.playbackRate = 1.0;

        const startVideo = () => {
          if (video.paused) {
            video.playbackRate = 1.0;
            video.play().catch(() => {});
          }
          window.removeEventListener('click', startVideo);
          window.removeEventListener('keydown', startVideo);
        };
        window.addEventListener('click', startVideo);
        window.addEventListener('keydown', startVideo);
      }
    });
  </script>
</head>
